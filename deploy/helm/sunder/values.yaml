image:
  repository: ghcr.io/fvisic/sunder
  tag: v0.5.1
  # The ops image (anchor/verify-audit cron jobs) needs openssl:
  opsTag: v0.5.1-ops

replicaCount: 2

# PostgreSQL connection string. Provide via an existing secret (key SUNDER_DB_URL);
# never inline credentials in values files committed to git.
database:
  existingSecret: sunder-db

keystore:
  # vault is the right choice on Kubernetes: the file driver would need a
  # ReadWriteMany volume shared across replicas.
  type: vault
  # Let `serve` CREATE key material for a version live data was already
  # written under. Off, and it should stay off: minting there recovers
  # nothing - it manufactures a vault that cannot read its own contents and
  # then reports healthy (/healthz 200, every lookup a 404). On Kubernetes
  # the usual cause is a Vault path or token pointing at the wrong place, and
  # failing closed is what makes that visible. `sunder bootstrap` always
  # mints; it is the explicit "create this vault" act.
  allowMint: false
  vault:
    addr: https://vault.internal:8200
    mount: secret
    # token via existing secret (key SUNDER_VAULT_TOKEN)
    existingSecret: sunder-vault

# Shared rate-limit counters across replicas (strongly recommended when
# replicaCount > 1). Leave addr empty for per-replica in-memory windows.
redis:
  addr: ""
  existingSecret: ""   # optional, key SUNDER_REDIS_PASSWORD
  failClosed: false

tls:
  # TLS between the ingress/mesh and sunder; keys via existing TLS secret.
  enabled: false
  secretName: sunder-tls
  # Optional client-CA bundle secret (key ca.crt) to enforce mTLS.
  mtlsSecretName: ""

metrics:
  # Optional bearer token protecting /metrics (key SUNDER_METRICS_TOKEN).
  existingSecret: ""

# P2.1 signer split: run all cryptography in a sidecar that is the only
# holder of key material; the main container then never sees keys. The
# sidecar shares an emptyDir socket volume and runs with no service ports.
signer:
  enabled: false

# P2.2 network policies: default-deny posture for the Sunder pods. Requires
# a CNI that enforces NetworkPolicy (Cilium, Calico, ...).
networkPolicy:
  enabled: false
  # Only pods carrying <clientLabel>: "true" may call the API.
  clientLabel: sunder-client
  # Additional namespaces allowed to call the API (by name).
  allowedNamespaces: []
  dbPort: 5432
  redisPort: 6379
  # Narrow Redis egress (empty = any); required when redis.addr is set.
  redisCIDR: ""
  # Namespace allowed to scrape /metrics (e.g. "monitoring"); empty = none.
  monitoringNamespace: ""
  # Namespace the ingress controller runs in, allowed to reach the portal
  # port; empty = any source may reach the portal port.
  ingressNamespace: ""
  # Narrow DB egress to the database subnet, e.g. 10.12.0.0/24.
  dbCIDR: ""
  # Narrow HTTPS/Vault egress (TSA, Vault, webhook receivers); empty = any.
  egressCIDRs: []

# Self-service privacy portal (docs/CONFIG.md). OFF by default. With mTLS on
# the API, set listenPort so citizens reach the portal on its own listener -
# browsers cannot present a client certificate (review N12/P8).
portal:
  enabled: false
  listenPort: 8081          # 0 = mount on the API listener instead
  baseUrl: ""               # e.g. https://privacy.acme.example (builds the magic link)
  clientIpHeader: ""        # e.g. X-Forwarded-For; the RIGHT-most entry is used
  trustedProxyHops: 0       # extra hops to skip from the right
  cookieInsecure: false     # development only

# Deployment tunables (docs/CONFIG.md). Empty = server default. These are
# security trade-offs, not preferences - read the docs before changing.
tunables:
  otiTtl: ""             # SUNDER_OTI_TTL, e.g. "90s" (default 5m; bearer-token window!)
  piiAlg: ""             # SUNDER_PII_ALG: aes256gcm (default) | xchacha20poly1305
  webhookTimeout: ""     # SUNDER_WEBHOOK_TIMEOUT, e.g. "30s" (default 5s)
  webhookMaxAttempts: "" # SUNDER_WEBHOOK_MAX_ATTEMPTS (default 10)
  deliverInterval: ""    # SUNDER_DELIVER_INTERVAL, e.g. "30s" (default 1m)
  # How long a claimed erasure-notification or portal-mail row may go
  # unsettled before a reaper returns it to PENDING. Both outboxes commit the
  # claim BEFORE the side effect, so this is the only thing that recovers a
  # claim abandoned by a killed worker - and on Kubernetes pods are killed
  # routinely. Set it above the worst-case sweep (webhookTimeout x batch).
  workerClaimTtl: ""     # SUNDER_WORKER_CLAIM_TTL, e.g. "5m" (default 10m)
  # How long a key version sits RETIRING before `keys retire` purges it. Must
  # exceed the worst-case KeyRing cache staleness ACROSS THE FLEET: the purge
  # is one-shot, so a replica still writing under the old version afterwards
  # leaves search-token rows nothing will ever match or delete. Raise it for a
  # large replica count; never set it to 0 on more than one replica.
  keyRetireGrace: ""     # SUNDER_KEY_RETIRE_GRACE, e.g. "5m" (default 60s)
  # Header trusted for the per-IP limit on the credential-less share fetch,
  # e.g. "X-Forwarded-For". Behind an ingress, RemoteAddr is the proxy for
  # every requester, so the limit collapses to one shared bucket - but
  # trusting the header where nothing appends it hands every requester a
  # FRESH bucket. Set it only when a proxy you control writes it.
  apiClientIpHeader: ""  # SUNDER_API_CLIENT_IP_HEADER
  # Persons per page in `sunder keys rekey`, and how many persons' search
  # tokens go into ONE INSERT. The sweep used to write a token per statement:
  # on 26.9M contacts that is 193.6 million synchronous round trips and about
  # 87 hours, with PostgreSQL idle. A key rotation is a security response, so
  # a sweep nobody can finish is a capability nobody has. Lower it to hold
  # less memory per batch and be gentler on a loaded database.
  rekeyBatch: ""         # SUNDER_REKEY_BATCH, 1-10000 (default 500)
  # Upper bound on one cascading erasure. A cascade erases one person per
  # transaction; unbounded, a link type with tens of thousands of members
  # would hold connections for minutes inside a single request. Above this
  # count the request is REFUSED before anything is erased.
  maxCascadeChildren: "" # SUNDER_MAX_CASCADE_CHILDREN, 1-1000000 (default 1000)

# Derived search indexes (F1/F2). Both OFF by default: each widens the search
# surface and adds token rows per contact. Enabling either on an existing
# dataset means "flip the value, then run `sunder keys rekey`" - the sweep
# backfills the derived tokens from the encrypted blobs.
search:
  fuzzyName: false      # SUNDER_SEARCH_FUZZY_NAME: phonetic name narrowing
  phoneSuffix: false    # SUNDER_SEARCH_PHONE_SUFFIX: last-8-digit phone lookup
  # Strict posture: fuzzy and partial lookups additionally spend a 60-second
  # single-use unlock token. Off by default because a pre-flight round trip
  # per caller-ID lookup kills that flow; BULK surfaces require one regardless.
  unlock: false         # SUNDER_SEARCH_UNLOCK

# Cross-org shares (F6).
shares:
  # When true, GET /v1/shares/{uuid} needs no credential - the UUID IS the
  # bearer. Logged as a startup warning, and rate-limited per IP via
  # tunables.apiClientIpHeader, which behind an ingress you must set for the
  # limit to mean anything.
  public: false         # SUNDER_SHARES_PUBLIC

# Attribute version history (F8). Version history is personal data: the
# retention sweep prunes it and erasure destroys it like any other blob.
versions:
  keep: ""              # SUNDER_VERSIONS_KEEP, e.g. "5" (0 = off, max 1000)
  ttl: ""               # SUNDER_VERSIONS_TTL, e.g. "365d" (0s = count cap only)

# File vault (F5). Off unless storage is set.
#
# `local` is deliberately NOT offered here: ciphertext would live in a
# per-process directory while metadata and the wrapped DEK live in the shared
# database, so a second replica answers a download with 200 and an empty body.
# On Kubernetes that is not a configuration choice, it is a data-loss shape.
files:
  storage: ""           # SUNDER_FILES_STORAGE: "" (disabled) or "s3"
  maxMB: ""             # SUNDER_FILES_MAX_MB, 1-256 with the s3 driver
  # Simultaneous uploads. A single-PUT body is buffered whole, so peak upload
  # memory is roughly this times maxMB - size it against the pod's limit.
  maxConcurrentUploads: ""  # SUNDER_FILES_MAX_CONCURRENT_UPLOADS (default 4)
  s3:
    endpoint: ""        # SUNDER_FILES_S3_ENDPOINT, https
    bucket: ""          # SUNDER_FILES_S3_BUCKET
    region: ""          # SUNDER_FILES_S3_REGION (default us-east-1)
    pathStyle: false    # SUNDER_FILES_S3_PATH_STYLE, true for MinIO
    # Access key id and secret come from a Secret with keys
    # SUNDER_FILES_S3_ACCESS_KEY and SUNDER_FILES_S3_SECRET_KEY - never from
    # values.yaml, which lands in the release manifest.
    existingSecret: ""

anchor:
  enabled: true
  schedule: "17 2 * * *"       # daily; only a 32-byte digest leaves the cluster
  tsaUrl: https://freetsa.org/tsr
  # CA bundle used to verify the TSA's tokens. The vendored default matches
  # the FreeTSA URL above; point BOTH at your own TSA together, or anchoring
  # hard-fails and silently stops producing evidence (review N19).
  #
  # For a custom TSA: put the bundle in a Secret, name it in caSecretName
  # (mounted at /etc/sunder/tsa-ca) and set caPath to the file inside it,
  # e.g. caSecretName: my-tsa-ca + caPath: /etc/sunder/tsa-ca/ca.pem
  caPath: /etc/sunder/tsa-ca.pem
  caSecretName: ""
  # PVC where exported .tsr tokens land; sync it to write-once storage OFF
  # the database host - anchors kept only in the database are circular.
  pvc:
    size: 1Gi
    storageClassName: ""

retention:
  enabled: true
  schedule: "43 3 * * *"

# Audit posture (docs/CONFIG.md; docs/THREAT-MODEL.md "Audit chain" - these
# are security trade-offs, not preferences). Empty = server default.
audit:
  sealing: ""        # SUNDER_AUDIT_SEALING: async (default) | sync
  reads: ""          # SUNDER_AUDIT_READS: bucketed (default) | chained
  # Record lookups as one action or three (lookup / lookup.fuzzy /
  # lookup.suffix). Splitting is what lets an auditor tell exact-identifier
  # resolution from phonetic or partial search once the per-event detail has
  # been dropped by bucketing. Worst case it triples read-bucket rows for a
  # client that uses all three forms in one hour - measured, see docs/CONFIG.md.
  lookupActions: ""  # SUNDER_AUDIT_LOOKUP_ACTIONS: single (default) | split
  sealInterval: ""   # SUNDER_AUDIT_SEAL_INTERVAL, e.g. "200ms"
  sealDelay: ""      # SUNDER_AUDIT_SEAL_DELAY, e.g. "2s"
  sealBatch: ""      # SUNDER_AUDIT_SEAL_BATCH, e.g. "5000"
  # How old the OLDEST unchained row may get before `verify-audit` calls it a
  # failure. Under async sealing a backlog is normal; a STALE one is the
  # stalled-sealer incident, and the daily verify CronJob below is what
  # notices. Applies to the API pods and that CronJob alike.
  staleUnsealed: ""  # SUNDER_AUDIT_STALE_UNSEALED, e.g. "5m" (default 15m)
  # The recommended hardening: sealing runs in a dedicated single-replica
  # deployment (SUNDER_AUDIT_SEAL_EXTERNAL on the API pods), so the API
  # role needs no UPDATE on the audit table.
  sealer:
    enabled: false
  # A chain nobody verifies is decoration: this cron runs `verify-audit`
  # daily (chain + read buckets + stored TSA anchors; exit != 0 on a break -
  # alert on job failure). With anchor.enabled it also cross-checks the
  # exported .tsr files.
  verify:
    enabled: true
    schedule: "29 4 * * *"

resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {memory: 512Mi}

# Startup budget for `serve`, which applies pending migrations before it
# listens. periodSeconds x failureThreshold is how long a migration may take
# before Kubernetes gives up; raise it for a large database. Liveness does
# not start probing until the startup probe passes (OPS-CLI-CONFIG-6).
startupProbe:
  periodSeconds: 10
  failureThreshold: 60   # 10 minutes

# A pprof listener for diagnosing a stall. EMPTY in production: the endpoint
# has no authentication and exposes stack traces, heap contents and the
# command line. Set it to a pod-local address (e.g. "127.0.0.1:6060") and
# reach it with `kubectl port-forward`, never through a Service.
debugAddr: ""        # SUNDER_DEBUG_ADDR
