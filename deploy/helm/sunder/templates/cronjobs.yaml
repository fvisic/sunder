{{- if .Values.anchor.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-sunder-anchors
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.anchor.pvc.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.anchor.pvc.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-sunder-anchor
spec:
  schedule: {{ .Values.anchor.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          # fsGroup so the non-root image (uid 65532) can write the anchor
          # PVC, which mounts root-owned 0755 by default (finding F9).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: anchor
              image: "{{ .Values.image.repository }}:{{ .Values.image.opsTag }}"
              args: ["anchor", "-out", "/anchors", "-ca", {{ .Values.anchor.caPath | quote }}]
              env:
                {{- include "sunder.env" . | nindent 16 }}
                - name: SUNDER_TSA_URL
                  value: {{ .Values.anchor.tsaUrl | quote }}
              volumeMounts:
                - {name: anchors, mountPath: /anchors}
                {{- if .Values.anchor.caSecretName }}
                - {name: tsa-ca, mountPath: /etc/sunder/tsa-ca, readOnly: true}
                {{- end }}
          volumes:
            - name: anchors
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-sunder-anchors
            {{- if .Values.anchor.caSecretName }}
            # A custom TSA needs its own CA bundle: without this the chart
            # could only ever verify FreeTSA tokens, while anchor.tsaUrl was
            # presented as configurable (review N19).
            - name: tsa-ca
              secret: {secretName: {{ .Values.anchor.caSecretName }}}
            {{- end }}
{{- end }}
{{- if .Values.retention.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-sunder-retention
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          # fsGroup so the non-root image (uid 65532) can write the anchor
          # PVC, which mounts root-owned 0755 by default (finding F9).
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: retention
              image: "{{ .Values.image.repository }}:{{ .Values.image.opsTag }}"
              args: ["retention", "run"]
              env: {{- include "sunder.env" . | nindent 16 }}
{{- end }}
{{- if .Values.audit.verify.enabled }}
---
# Daily tamper-evidence verification: the chain, the read buckets and the
# stored TSA anchors are recomputed and checked; a break exits non-zero, so
# alert on failures of this job. With anchoring on it also cross-checks the
# exported .tsr files against the database.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-sunder-verify-audit
  labels: {{- include "sunder.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.audit.verify.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: verify-audit
              image: "{{ .Values.image.repository }}:{{ .Values.image.opsTag }}"
              {{- if .Values.anchor.enabled }}
              args: ["verify-audit", "-anchors", "/anchors", "-ca", {{ .Values.anchor.caPath | quote }}]
              {{- else }}
              args: ["verify-audit"]
              {{- end }}
              env:
                - name: SUNDER_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.existingSecret }}
                      key: SUNDER_DB_URL
                {{- include "sunder.auditEnv" . | nindent 16 }}
              {{- if .Values.anchor.enabled }}
              volumeMounts:
                - {name: anchors, mountPath: /anchors, readOnly: true}
                {{- if .Values.anchor.caSecretName }}
                - {name: tsa-ca, mountPath: /etc/sunder/tsa-ca, readOnly: true}
                {{- end }}
              {{- end }}
          {{- if .Values.anchor.enabled }}
          volumes:
            - name: anchors
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-sunder-anchors
            {{- if .Values.anchor.caSecretName }}
            - name: tsa-ca
              secret:
                secretName: {{ .Values.anchor.caSecretName }}
            {{- end }}
          {{- end }}
{{- end }}
