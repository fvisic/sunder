services:
  postgres:
    image: postgres:16
    # Stock Postgres ships with 128 MB shared_buffers - a footgun the 26.8M
    # scale test paid for (P4.5). These values suit a small host (2-4 GB
    # for the database); size shared_buffers to ~25% of the RAM you give
    # Postgres and effective_cache_size to ~75%. The sizing table lives in
    # docs/CONFIG.md ("PostgreSQL sizing").
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: sunder
      POSTGRES_USER: sunder
      POSTGRES_PASSWORD: sunder-dev-only
    volumes:
      # Persist data: recreating the stack must not invalidate issued
      # credentials and registered contacts (the keystore volume already
      # persists keys - losing one but not the other splits the state).
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: never expose the dev database on all interfaces.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunder"]
      interval: 2s
      timeout: 2s
      retries: 15

  sunder:
    build:
      context: ..
      target: runtime
    environment:
      SUNDER_DB_URL: postgres://sunder:sunder-dev-only@postgres:5432/sunder
      SUNDER_LISTEN: ":8080"
      SUNDER_KEYSTORE: file
      SUNDER_KEYSTORE_PATH: /keystore
    volumes:
      - keystore:/keystore
    ports:
      # Loopback only, like the database: the dev API should not listen on
      # every interface of the developer's machine.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keystore:
  pgdata:
