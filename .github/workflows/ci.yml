name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sunder_test
          POSTGRES_USER: sunder
          POSTGRES_PASSWORD: sunder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunder"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      SUNDER_TEST_DB_URL: postgres://sunder:sunder@localhost:5432/sunder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 go build -mod=readonly ./...
      - name: Vet
        run: go vet ./...
      - name: Test with coverage gate
        run: |
          go test -race -coverprofile=cover.out -coverpkg=./internal/...,./cmd/... ./...
          TOTAL=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { exit (t >= 80.0 ? 0 : 1) }' || {
            echo "::error::coverage ${TOTAL}% is below the 80% gate"; exit 1; }
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Dependencies up to date check
        run: |
          go list -u -m all | grep '\[' && echo "::warning::outdated dependencies found" || true

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        working-directory: sdks/python
        run: python3 -m unittest discover -s tests -v

  sdk-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Test
        working-directory: sdks/php
        run: |
          composer install --no-interaction
          vendor/bin/phpunit tests

  sdk-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test
        working-directory: sdks/java
        run: bash run-tests.sh

  sdk-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        working-directory: sdks/dotnet
        run: dotnet test SunderId.sln --nologo

  e2e-demo:
    # Builds the real image, boots the compose stack, and runs the demo
    # script — which asserts every expected status code, so it doubles as a
    # smoke test of the whole API surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack
        run: docker compose -f deploy/docker-compose.yml up --build -d --wait
      - name: Create demo clients
        run: |
          echo "SUNDER_CRED_CRM=$(docker compose -f deploy/docker-compose.yml exec sunder /sunder client create -id crm -name CRM -scope crm -actions contacts.register,lookup,attributes.read,oti.issue -purposes support,create_order -rate 1000 | tail -1)" >> "$GITHUB_ENV"
          echo "SUNDER_CRED_ERP=$(docker compose -f deploy/docker-compose.yml exec sunder /sunder client create -id erp -name ERP -scope erp -actions oti.verify -purposes create_order | tail -1)" >> "$GITHUB_ENV"
      - name: Run demo
        run: bash demo/callcenter.sh
      - name: Verify audit chain
        run: docker compose -f deploy/docker-compose.yml exec sunder /sunder verify-audit
