name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The whole suite runs once per audit sealing mode: "sync" is a
    # security switch, and a switch nobody tests becomes a lie within two
    # releases (P4.1).
    strategy:
      matrix:
        # The two headline postures, PLUS (sync, bucketed) - the cross
        # combination where sync sealing meets the read-bucket hour close
        # (the H11 fix's surface); it was the untested corner of the
        # pairwise matrix (L14). Coverage is gated on the deterministic
        # non-race legs, so a third leg is cheap.
        include:
          - audit_sealing: async
            audit_reads: bucketed
          - audit_sealing: sync
            audit_reads: chained
          - audit_sealing: sync
            audit_reads: bucketed
          # (async, chained): the fourth corner. Async sealing is the
          # DEFAULT, so a leg that pairs it with per-event read chaining -
          # the posture an operator picks when hour-granularity read
          # evidence is not enough - was the one combination CI never ran
          # (TESTS-11).
          - audit_sealing: async
            audit_reads: chained
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sunder_test
          POSTGRES_USER: sunder
          POSTGRES_PASSWORD: sunder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunder"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      SUNDER_TEST_DB_URL: postgres://sunder:sunder@localhost:5432/sunder_test
      SUNDER_TEST_REDIS_ADDR: 127.0.0.1:6379
      SUNDER_AUDIT_SEALING: ${{ matrix.audit_sealing }}
      SUNDER_AUDIT_READS: ${{ matrix.audit_reads }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=0 go build -mod=readonly ./...
      - name: Vet
        run: go vet ./...
      # `go vet` catches a narrow class. staticcheck catches the ones that
      # read as fine: unused writes, dead code, nil contexts, impossible type
      # assertions. It found dead code in internal/service on its first run.
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      # Race detection and the coverage gate are separate concerns. The
      # race detector reschedules goroutines aggressively, which makes the
      # coverage of concurrency branches (sealer, outbox worker) vary run to
      # run - so measuring the gate under -race produced a jittery number
      # right at the threshold. Run the detector for correctness, then a
      # deterministic non-race pass for the coverage number.
      # -shuffle=on so an order dependency between tests is a failure rather
      # than a latent assumption; -timeout so a deadlock (which is exactly
      # what several of these tests probe for) fails loudly instead of
      # hanging the job to its 6-hour ceiling; -count=1 so nothing is served
      # from the build cache (TESTS-11).
      - name: Race detector
        run: go test -race -shuffle=on -count=1 -timeout=25m ./...
      - name: Coverage gate
        run: |
          go test -count=1 -timeout=25m -covermode=atomic \
            -coverprofile=cover.out -coverpkg=./internal/...,./cmd/... ./...
          go tool cover -func=cover.out | tail -1
          # ops/coverage-gate.sh applies the //coverage:defensive exclusion
          # list (see the header of that script) before comparing against the
          # gate, and fails if a marker sits on a block that IS covered or if
          # the excluded share grows past its ceiling.
          ops/coverage-gate.sh cover.out 90.0
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Dependencies up to date check
        run: |
          go list -u -m all | grep '\[' && echo "::warning::outdated dependencies found" || true

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet and test
        working-directory: sdks/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test -race ./...

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A warning printed by a green job is a warning nobody reads: the .NET
      # SDK carried two batches of them across a whole release for exactly
      # that reason. Java has had -Xlint:all -Werror since it was written and
      # has never accumulated one.
      - name: Lint
        working-directory: sdks/python
        run: |
          pip install ruff
          ruff check --select E,F,W,I,UP,B,SIM,RUF .
      - name: Test
        working-directory: sdks/python
        run: python3 -m unittest discover -s tests -v

  sdk-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Test
        working-directory: sdks/php
        run: |
          composer install --no-interaction
          vendor/bin/phpunit tests
      # Level 5 with three written-down exceptions, each a case where PHPStan
      # trusts a docblock further than the runtime does (see phpstan.neon).
      - name: Static analysis
        working-directory: sdks/php
        run: vendor/bin/phpstan analyse --no-progress

  sdk-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test
        working-directory: sdks/java
        run: bash run-tests.sh

  sdk-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        working-directory: sdks/dotnet
        run: dotnet test SunderId.sln --nologo

  e2e-demo:
    # Builds the real image, boots the compose stack, and runs the demo
    # script - which asserts every expected status code, so it doubles as a
    # smoke test of the whole API surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack
        run: docker compose -f deploy/docker-compose.yml up --build -d --wait
      - name: Create demo clients
        run: |
          echo "SUNDER_CRED_CRM=$(docker compose -f deploy/docker-compose.yml exec sunder /sunder client create -id crm -name CRM -scope crm -actions contacts.register,lookup,attributes.read,oti.issue -purposes support,create_order -rate 1000 | tail -1)" >> "$GITHUB_ENV"
          echo "SUNDER_CRED_ERP=$(docker compose -f deploy/docker-compose.yml exec sunder /sunder client create -id erp -name ERP -scope erp -actions oti.verify -purposes create_order | tail -1)" >> "$GITHUB_ENV"
      - name: Run demo
        run: bash demo/quickstart.sh
      - name: Create feature-demo client
        run: |
          echo "SUNDER_CRED_VAULT=$(docker compose -f deploy/docker-compose.yml exec sunder /sunder client create -id vault -name Vault -scope crm -actions contacts.register,attributes.read,tokens.create,tokens.read,tokens.delete,admin.unlock,files.write,files.read,attributes.history,links.manage,shares.create,consent.manage,dsr.erase -purposes support -rate 1000 -ttl 1d | tail -1)" >> "$GITHUB_ENV"
      - name: Run feature demos F4-F8
        run: |
          for s in f4-value-tokens f5-file-vault f6-versioning f7-sub-accounts f8-shared-records; do
            echo "=== demo/$s.sh ==="; bash "demo/$s.sh"
          done
      - name: Run feature demo F9 (Shamir, CLI)
        run: SUNDER_EXEC='docker compose -f deploy/docker-compose.yml exec -T sunder /sunder' bash demo/f9-shamir-recovery.sh
      # escalation.sh needs its own pair of credentials (a notifier scope),
      # which is why it was never added here - and it then sat broken,
      # returning 403 at step 2, while docs/API.md pointed readers at it.
      # Every shipped demo script runs in CI now, and the `demos` check in
      # ops/check-artifact-coverage.sh fails the build if a new one is added
      # without a job that executes it.
      - name: Create escalation demo clients
        run: |
          echo "SUNDER_CRED_CRM=$(docker compose -f deploy/docker-compose.yml exec sunder /sunder client create -id crm-esc -name CRM -scope crm -actions contacts.register,oti.issue,attributes.read -purposes escalation_notify -rate 1000 | tail -1)" >> "$GITHUB_ENV"
          echo "SUNDER_CRED_NOTIFIER=$(docker compose -f deploy/docker-compose.yml exec sunder /sunder client create -id notifier -name Notifier -scope notifier -actions oti.verify,attributes.read,consent.manage -purposes escalation_notify -rate 1000 | tail -1)" >> "$GITHUB_ENV"
      - name: Run delayed-flow demo (escalation)
        run: bash demo/escalation.sh
      - name: Verify audit chain
        run: docker compose -f deploy/docker-compose.yml exec sunder /sunder verify-audit

  e2e-playground:
    # Boots the stack WITH the playground overlay and drives every
    # walkthrough through the playground's own API, exactly as a visitor
    # clicking "Run every step" would. A scenario whose expected status the
    # service no longer returns fails here - which is what keeps the demo
    # from quietly drifting away from the product.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack with the playground
        run: |
          docker compose -f deploy/docker-compose.yml \
                         -f deploy/docker-compose.playground.yml up --build -d --wait
      - name: Run every walkthrough
        run: python3 ops/playground_e2e.py
      - name: Playground logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml \
                         -f deploy/docker-compose.playground.yml logs --tail=100 seed playground deliver

  cold-boot:
    # The conditions a customer's FIRST deployment meets and nothing else
    # does: an empty database, an empty keystore, and two processes starting
    # together. The migration race that crash-looped the whole stack was
    # found by accident, because one leg happened to boot that way - this
    # makes it deliberate. Every scenario tears down with `down -v`, so a
    # stack restarted onto existing data can never mask a cold-boot bug.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cold-boot and multi-replica scenarios
        run: ./ops/coldboot-scenarios.sh
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml \
                         -f deploy/docker-compose.playground.yml logs --tail=80 || true

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --strict fails on any broken nav entry or dead intra-site link, so
      # the guides cannot rot silently.
      - name: Build guides site
        run: |
          pip install mkdocs-material pyyaml
          cd docs-site && mkdocs build --strict

      # Claims the project has measured and withdrawn, or that shipped
      # features contradict. mkdocs --strict catches broken links, not
      # statements that stopped being true (DOCS-11): a reviewer bounding
      # scope from "deliberate non-goals", or an operator sizing hardware
      # from a retracted throughput conclusion, is misled by prose that
      # builds cleanly.
      # DOCS-16: a knob the code reads and no table names is a knob an
      # operator cannot find.
      - name: Config reference covers every variable
        run: ./ops/check-config-docs.sh

      # VERSION exists so "which build is this?" is one command on a machine
      # with no git and no toolchain. A version file nobody checks drifts, and
      # a drifted one answers confidently and wrongly.
      - name: VERSION, the tag, the SDK manifests and the CHANGELOG agree
        run: ./ops/check-versions.sh

      # The same shape, extended to the artifacts that had NO guard: the Helm
      # chart, the Postman collection, SDK parity across all six languages,
      # and the docs-site mirror of the config reference. v0.5.0 shipped with
      # gaps in three of those four, every one found by a person asking.
      - name: Every feature reaches every artifact
        run: ./ops/check-artifact-coverage.sh

      # sales/ is gitignored, so this is a no-op here by design - it exists so
      # the same command works locally and at release time, where the deck IS
      # present. Running it in CI keeps the script itself from bit-rotting.
      - name: Sales deck figures trace to a measurement
        run: ./ops/check-sales-deck.sh

      - name: Refuse retracted claims
        run: |
          set -e
          fail=0
          # A document may QUOTE a retracted claim in order to correct it;
          # what must not survive is the assertive form.
          check() {
            if grep -rniI --include='*.md' -- "$1" README.md docs docs-site 2>/dev/null \
               | grep -viE 'earlier|disproved|withdrawn|retracted|correction|corrected|used to|no longer'; then
              echo "::error::retracted or contradicted claim found: $2"
              fail=1
            fi
          }
          check "bounded by storage commit latency" "the fdatasync throughput conclusion was measured and withdrawn (THREAT-MODEL: the advisory lock is the ceiling)"
          check "privacy portal remains" "the self-service privacy portal has shipped"
          check "no verifiable credentials" "predicate-based selective disclosure has shipped (P2.3)"
          check "Search tokens survive a retention wipe" "the retention sweep deletes them once nothing live remains (S6)"
          check "Consent decisions survive erasure" "erasure deletes consent STATE; the audit trail is the accountability record"
          check "UPDATE only \`prev_hash\`/\`hash\`/\`chain_seq\`" "the sealing UPDATE also writes hash_v, and the sealer needs grants on audit_read_buckets (DOCS-1)"
          exit $fail
