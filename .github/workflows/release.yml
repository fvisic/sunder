name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to GHCR
  id-token: write   # cosign keyless signing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries (linux/darwin, amd64/arm64)
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/sunder-${GITHUB_REF_NAME}-$os-$arch" ./cmd/sunder
            done
          done
          (cd dist && shasum -a 256 sunder-* > SHA256SUMS)

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sunder-${{ github.ref_name }}.sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums and SBOM (keyless)
        run: |
          cosign sign-blob --yes dist/SHA256SUMS \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem
          cosign sign-blob --yes "dist/sunder-${GITHUB_REF_NAME}.sbom.spdx.json" \
            --output-signature "dist/sunder-${GITHUB_REF_NAME}.sbom.spdx.json.sig" \
            --output-certificate "dist/sunder-${GITHUB_REF_NAME}.sbom.spdx.json.pem"

      - name: Push image to GHCR and sign it
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          docker build --target runtime -t "$IMAGE" .
          docker build --target ops -t "$IMAGE-ops" .
          docker push "$IMAGE"
          docker push "$IMAGE-ops"
          for tag in "$IMAGE" "$IMAGE-ops"; do
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")
            cosign sign --yes "$DIGEST"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Sunder $GITHUB_REF_NAME" \
            --generate-notes
